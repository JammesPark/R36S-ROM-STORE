name: Validar instalador online e pacote manual oficial
on:
  push:
    branches: [main]
    paths:
      - INSTALAR_R36S_ROM_STORE.sh
      - .github/workflows/downloads-oficiais.yml
  workflow_dispatch:
permissions: {contents: write}
jobs:
  validate:
    if: github.repository == 'JammesPark/R36S-ROM-STORE' && github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Verificar instalador com o canal oficial ativo e uma instalação isolada
        run: |
          set -euo pipefail
          sh -n INSTALAR_R36S_ROM_STORE.sh
          bash -n INSTALAR_R36S_ROM_STORE.sh
          test ! -e /roms
          sudo mkdir -p /roms/ports/r36sromsstore/conf
          sudo chown -R "$(id -u):$(id -g)" /roms
          printf 'preservar\n' > /roms/ports/r36sromsstore/conf/installer-test.txt
          printf 'preservar\n' > /roms/ports/r36sromsstore/senhas.txt
          # The current public feed is 0.7.0-beta. No real card is touched.
          if ! R36SBR_INSTALLER_TEST=1 sh INSTALAR_R36S_ROM_STORE.sh sd1 --lang=pt; then
            cat /roms/ports/instalador_ultimo.log || true
            exit 1
          fi
          test -s '/roms/ports/R36S ROMS STORE.sh'
          test -s /roms/ports/r36sromsstore/game.love
          test "$(cat /roms/ports/r36sromsstore/conf/installer-test.txt)" = preservar
          test "$(cat /roms/ports/r36sromsstore/senhas.txt)" = preservar
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('/roms/ports/r36sromsstore/game.love') as z:
              assert 'C.VERSION_NUM = "0.7.0-beta"' in z.read('config.lua').decode()
          PY
      - name: Gerar ZIP manual sem launcher e sem dados pessoais
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/manual"
          gh release download store-v0.7.0-beta --repo JammesPark/R36S-ROM-STORE-UPDATES --pattern R36S_ROMS_STORE_0.7.0-beta_OTA.zip --dir "${RUNNER_TEMP}/manual"
          cd "${RUNNER_TEMP}/manual"
          echo 'ac0c5c899cdd5526b19fa0f0cca8e7fab60dd25b659a6e995dd12e9b0969bd37  R36S_ROMS_STORE_0.7.0-beta_OTA.zip' | sha256sum -c -
          python3 - <<'PY'
          import hashlib,json
          from zipfile import ZipFile
          protected={'conf','logs','tmp','backups','gravacoes','bios','update','senhas.txt','catalog.json','catalogo_proprio.zlib','catalogo_proprio_ultimo_valido.zlib','catalog_url.txt','update_url.txt','bios_url.txt','stats_url.txt','themes_url.txt','es_themes_url.txt','runtimes_url.txt','log.txt','configuracoes','saves','user_themes','favorites.json','downloads.json','settings.txt','theme.txt'}
          source='R36S_ROMS_STORE_0.7.0-beta_OTA.zip'
          dest='R36S_ROMS_STORE_0.7.0-beta_UPDATE.zip'
          with ZipFile(source) as src, ZipFile(dest,'w') as out:
              m=json.loads(src.read('update_manifest.json'))
              assert m['version']=='0.7.0-beta' and m['type']=='full'
              seen=set()
              for e in m['files']:
                  p=e['path']
                  assert p not in seen
                  seen.add(p)
                  data=src.read(p)
                  assert len(data)==e['size'] and hashlib.sha256(data).hexdigest()==e['sha256']
                  if p=='R36S ROMS STORE.sh':continue
                  parts=p.split('/')
                  assert len(parts)>1 and parts[0]=='r36sromsstore' and not any(x in ('','.','..') for x in parts) and '\\' not in p
                  if parts[1] in protected or parts[1].startswith('libs.'):continue
                  assert (src.getinfo(p).external_attr>>16)&0o170000!=0o120000
                  out.writestr(src.getinfo(p),data)
          with ZipFile(dest) as z:
              assert z.testzip() is None and 'r36sromsstore/game.love' in z.namelist()
              assert all(n.startswith('r36sromsstore/') for n in z.namelist())
          PY
          sha256sum R36S_ROMS_STORE_0.7.0-beta_UPDATE.zip > SHA256SUMS_UPDATE.txt
      - name: Publicar somente o pacote manual adicional da versão oficial existente
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/manual"
          tag=store-v0.7.0-beta
          repo=JammesPark/R36S-ROM-STORE
          test "$(gh release view "$tag" --repo "$repo" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
          for f in R36S_ROMS_STORE_0.7.0-beta_UPDATE.zip SHA256SUMS_UPDATE.txt; do
            if gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name' | grep -Fxq "$f"; then
              mkdir -p verify
              gh release download "$tag" --repo "$repo" --pattern "$f" --dir verify
              cmp "$f" "verify/$f"
            else
              gh release upload "$tag" "$f" --repo "$repo"
            fi
          done
          sha256sum -c SHA256SUMS_UPDATE.txt
