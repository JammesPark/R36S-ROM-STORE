name: Capturas reais da interface 0.7.0-beta
on:
  push:
    branches: ['docs/capturas-070']
    paths: ['.github/workflows/capturas-docs.yml']
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Preparar simulador LÖVE
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y love xvfb xauth python3-pil
          love --version
      - name: Capturar aplicativo original em janela 640x480
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/romstore-docs"
          mkdir -p "$tmp/home" "$tmp/data" "$tmp/config" "$tmp/ports" "$tmp/shots"
          cp -a port/r36sromsstore "$tmp/ports/"
          cat > "$tmp/roteiro.txt" <<'EOF'
          wait 10
          lang pt-BR
          theme default
          push menu
          wait 4
          screen
          shot pulse-menu
          push settings
          wait 2
          screen
          shot pulse-configuracoes
          pop
          theme neongrid
          wait 3
          screen
          shot matrix-menu
          push settings
          wait 2
          screen
          shot matrix-configuracoes
          quit
          EOF
          env HOME="$tmp/home" XDG_DATA_HOME="$tmp/data" XDG_CONFIG_HOME="$tmp/config" SDL_AUDIODRIVER=dummy ALSOFT_DRIVERS=null LIBGL_ALWAYS_SOFTWARE=1 R36SBR_WINDOWED=1 R36SBR_PORTS_DIR="$tmp/ports" R36SBR_DIR="$tmp/ports/r36sromsstore" R36SBR_AUTOTEST="$tmp/roteiro.txt" PORTHUB_SHOTDIR="$tmp/shots" timeout 90 xvfb-run -a -s "-screen 0 640x480x24" love src
          mkdir -p docs/images/atual
          python3 - "$tmp/shots" <<'PY'
          from PIL import Image
          from pathlib import Path
          import sys, shutil
          root=Path(sys.argv[1])
          for name in ('pulse-menu','pulse-configuracoes','matrix-menu','matrix-configuracoes'):
              p=root/(name+'.png')
              with Image.open(p) as im:
                  assert im.size==(640,480), (name,im.size)
                  im.verify()
              shutil.copy2(p, Path('docs/images/atual')/p.name)
          PY
      - name: Salvar capturas na branch de documentação
        run: |
          git config user.name github-actions
          git config user.email github-actions[bot]@users.noreply.github.com
          git add docs/images/atual
          git commit -m "docs: capturas do aplicativo em simulador" -m "Assisted-by: ChatGPT (OpenAI)"
          git push origin HEAD:refs/heads/docs/capturas-070
