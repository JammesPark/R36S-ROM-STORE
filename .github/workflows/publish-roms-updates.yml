name: Publicar atualização ROMS STORE (feed isolado)

on:
  workflow_run:
    workflows: ["R36S ROMS STORE - testes e build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "ID da build aprovada na main"
        required: true
        type: string

# O commit com [roms-online-release] libera publicação automática, após CI.
# Antes de usar, configurar ROMS_UPDATES_TOKEN (Contents write no repo público).
permissions:
  contents: read
  actions: read
jobs:
  publicar:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       contains(github.event.workflow_run.head_commit.message, '[roms-online-release]'))
    runs-on: ubuntu-24.04
    env:
      PUBLIC_REPO: JammesPark/R36SPORTSBR-STORE-UPDATES
      BUILD_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.build_run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validar a build aprovada e o commit da main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          RUN_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID")"
          RUN_SHA="$(jq -r '.head_sha' <<< "$RUN_JSON")"
          RUN_BRANCH="$(jq -r '.head_branch' <<< "$RUN_JSON")"
          RUN_CONCLUSION="$(jq -r '.conclusion' <<< "$RUN_JSON")"
          RUN_NAME="$(jq -r '.name' <<< "$RUN_JSON")"
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [[ "$RUN_SHA" != "$MAIN_SHA" || "$RUN_SHA" != "$GITHUB_SHA" ||
                "$RUN_BRANCH" != main || "$RUN_CONCLUSION" != success ||
                "$RUN_NAME" != "R36S ROMS STORE - testes e build" ]]; then
            echo "Build não aprovada para o commit atual da main." >&2
            exit 1
          fi
          echo "Build aprovada $BUILD_RUN_ID / $RUN_SHA"
      - name: Baixar os pacotes produzidos pela build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="$(tr -d '\r\n' < VERSION)"
          echo "ROM_VERSION=$V" >> "$GITHUB_ENV"
          mkdir -p dist
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "R36S-ROMS-STORE-TESTE" --dir dist
          PREFIX="R36S_ROMS_STORE_v$V"
          for s in TESTE UPDATE FONTE; do
            test -s "dist/$PREFIX""_$s.zip"
          done
      - name: Verificar ZIPs e preparar update.json
        shell: bash
        run: |
          set -euo pipefail
          V="$ROM_VERSION"
          PREFIX="R36S_ROMS_STORE_v$V"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          v=os.environ["ROM_VERSION"]
          changelog=Path("CHANGELOG.md").read_text(encoding="utf-8")
          section=re.search(r"(?ms)^## "+re.escape(v)+r"\s*\n(.*?)(?=^## |\Z)",changelog)
          if not section: raise SystemExit("Versão sem seção no CHANGELOG")
          notes="\n".join(x.strip() for x in section.group(1).splitlines() if x.strip().startswith("- "))
          if not notes: raise SystemExit("Notas da atualização vazias")
          Path("dist/notes.txt").write_text("R36S ROMS STORE "+v+"\n\n"+notes+"\n\nSoftware GPL-3.0.\n",encoding="utf-8")
          PY
          python3 tools/make_roms_feed.py --version "$V" \
            --update "dist/$PREFIX""_UPDATE.zip" \
            --installer "dist/$PREFIX""_TESTE.zip" \
            --source "dist/$PREFIX""_FONTE.zip" \
            --notes-file dist/notes.txt --out dist/update.json
          sha256sum dist/*.zip
      - name: Criar Release no repo público e ativar feed ROMS por último
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ROMS_UPDATES_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "Falta ROMS_UPDATES_TOKEN (Contents Read/Write no repositório público)." >&2
            exit 1
          fi
          V="$ROM_VERSION"
          PREFIX="R36S_ROMS_STORE_v$V"
          TAG="roms-v$V"
          F1="$PREFIX""_TESTE.zip"
          F2="$PREFIX""_UPDATE.zip"
          F3="$PREFIX""_FONTE.zip"
          if gh release view "$TAG" --repo "$PUBLIC_REPO" >/dev/null 2>&1; then
            echo "Release $TAG já existe; não sobrescrevendo." >&2
            exit 1
          fi
          # Atualização antiga nunca substitui um feed mais recente.
          OLD="$(gh api "repos/$PUBLIC_REPO/contents/roms-store/update.json" --jq '.content' | base64 -d)"
          export OLD
          python3 - <<'PY'
          import json,os,sys
          old=json.loads(os.environ["OLD"])
          a=old.get("version")
          b=os.environ["ROM_VERSION"]
          if a and old.get("status")=="published":
              def nums(s): return tuple(int(x) for x in s.split("-")[0].split("."))
              if nums(b)<=nums(a): sys.exit("Publicação não mais recente; abortando")
          PY
          gh release create "$TAG" "dist/$F1" "dist/$F2" "dist/$F3" \
            --repo "$PUBLIC_REPO" --title "R36S ROMS STORE $V" \
            --notes-file dist/notes.txt --prerelease
          ASSETS="$(gh release view "$TAG" --repo "$PUBLIC_REPO" --json assets --jq '.assets[].name')"
          for f in "$F1" "$F2" "$F3"; do grep -Fxq "$f" <<< "$ASSETS"; done
          mkdir -p verify
          gh release download "$TAG" --repo "$PUBLIC_REPO" --pattern "$F2" --dir verify
          cmp "dist/$F2" "verify/$F2"
          # Este diretório é só do ROMS STORE, não alterar o update.json antigo.
          FILE_SHA="$(gh api "repos/$PUBLIC_REPO/contents/roms-store/update.json" --jq '.sha')"
          CONTENT="$(base64 -w0 dist/update.json)"
          gh api "repos/$PUBLIC_REPO/contents/roms-store/update.json" --method PUT \
            --field "message=Ativar atualização ROMS STORE $V (SHA verificado)" \
            --field "sha=$FILE_SHA" \
            --field "content=$CONTENT" >/dev/null
          echo "Feed exclusivo ROMS STORE ativado após publicação verificada."
