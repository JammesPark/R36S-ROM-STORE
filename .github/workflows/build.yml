name: R36S ROMS STORE - testes e build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar dependencias de testes
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 zip unzip python3
      - name: Verificar sintaxe Lua e Bash
        run: |
          find src -type f -name '*.lua' -print0 | xargs -0 -r -n1 luac5.4 -p
          find port tools tests -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          python3 -m py_compile port/r36s-store-kpm/bin/archive_safe.py port/r36s-store-kpm/bin/gamestore_source.py
      - name: Testes
        run: |
          lua5.4 tests/test_json.lua
          R36S_STORE_OFFLINE_TEST=1 lua5.4 tests/test_ui_smoke.lua
          python3 tests/test_archives.py
          python3 tests/test_gamestore.py
          python3 tests/test_single_catalog.py
          bash tests/test_bootstrap.sh
          bash -x tests/test_backend.sh
      - name: Criar ZIPs instalavel e fonte
        run: bash tools/build.sh
      - name: Verificar conteudo do instalador
        run: |
          test -x 'port/R36S ROMS STORE.sh'
          test -x port/r36s-store-kpm/bin/worker.sh
          unzip -t build/R36S_ROMS_STORE_v0.2.0_TESTE.zip
          unzip -Z1 build/R36S_ROMS_STORE_v0.2.0_TESTE.zip | grep -F 'r36s-store-kpm/game.love'
          tmp=$(mktemp -d)
          unzip -q build/R36S_ROMS_STORE_v0.2.0_TESTE.zip -d "$tmp"
          test -x "$tmp/R36S ROMS STORE.sh"
          test -x "$tmp/r36s-store-kpm/bin/worker.sh"
          test ! -d "$tmp/r36s-store-kpm/bin/__pycache__"
          rm -rf "$tmp"
      - name: Publicar artefatos para download
        uses: actions/upload-artifact@v4
        with:
          name: R36S-ROMS-STORE-TESTE
          path: build/*.zip
          if-no-files-found: error
