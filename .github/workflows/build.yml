name: Validar e empacotar R36S ROMS STORE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar ferramentas de validação
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y luajit zip unzip

      - name: Conferir estrutura e LuaJIT
        shell: bash
        run: |
          set -euo pipefail
          test -f game/main.lua
          test -f game/config.lua
          test -f 'R36S ROMS STORE.sh'
          test -d r36sromsstore
          test -f LICENSE
          test -f NOTICE.md
          grep -q 'Lag do Lira' NOTICE.md
          find game -type f -name '*.lua' -print0 | while IFS= read -r -d '' f; do
            luajit -b "$f" /dev/null
          done

      - name: Testar armazenamento e instalação de ROMs
        run: |
          luajit tests/test_rom_storage.lua
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_rom_install.py

      - name: Gerar ZIP de instalação
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/version.py get
          sh tools/build.sh
          for pkg in build/*.zip; do unzip -tq "$pkg"; done

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Gerar instalador do commit validado
        run: sh tools/build.sh
      - name: Publicar instalador para download manual
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 tools/version.py get)
          tag="build-${GITHUB_SHA}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
              --title "R36S ROMS STORE $version (${GITHUB_SHA:0:7})" \
              --notes "Instalador manual para R36S/R36H. Extraia o ZIP na pasta ports do cartão."
          fi
          gh release upload "$tag" "build/R36S_ROMS_STORE_${version}.zip" --clobber
