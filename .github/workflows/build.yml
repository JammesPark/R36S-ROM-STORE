name: Validar código oficial R36S ROM STORE
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit zip unzip python3-pil
      - run: |
          set -eu
          python3 tools/version.py check
          sh -n INSTALAR_R36S_ROM_STORE.sh
          bash -n 'port/R36S ROM STORE.sh'
          find src -type f -name '*.lua' -exec luajit -b '{}' /dev/null \;
          ART_PYTHON=/usr/bin/python3 sh tools/build.sh
          STORE_CHANNEL=official python3 tools/verify_candidate_package.py build/R36S_ROM_STORE_$(python3 tools/version.py get).zip
