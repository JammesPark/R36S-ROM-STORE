name: Validar e empacotar R36S ROMS STORE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar ferramentas de validação
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y luajit zip unzip

      - name: Conferir estrutura e LuaJIT
        shell: bash
        run: |
          set -euo pipefail
          test -f game/main.lua
          test -f game/config.lua
          test -f 'R36S ROMS STORE.sh'
          test -d r36sromsstore
          test -f LICENSE
          test -f NOTICE.md
          grep -q 'Lag do Lira' NOTICE.md
          find game -type f -name '*.lua' -print0 | while IFS= read -r -d '' f; do
            luajit -b "$f" /dev/null
          done

      - name: Testar armazenamento e instalação de ROMs
        run: |
          luajit tests/test_rom_storage.lua
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_rom_install.py

      - name: Gerar ZIP de instalação
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/version.py get
          sh tools/build.sh
          for pkg in build/*.zip; do unzip -tq "$pkg"; done

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Gerar instalador do commit validado
        run: sh tools/build.sh
      - name: Publicar instalador para download manual
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 tools/version.py get)
          tag="build-${GITHUB_SHA}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
              --title "R36S ROMS STORE $version (${GITHUB_SHA:0:7})" \
              --notes "Instalador manual para R36S/R36H. Extraia o ZIP na pasta ports do cartão."
          fi
          gh release upload "$tag" "build/R36S_ROMS_STORE_${version}.zip" --clobber

      - name: Enviar versão nova ao canal público
        env:
          GH_TOKEN: ${{ secrets.ROMS_UPDATES_TOKEN }}
          PUBLIC_REPO: JammesPark/R36S-ROMS-HUB-STORE-UPDATES
        run: |
          set -euo pipefail
          version=$(python3 tools/version.py get)
          test -n "$GH_TOKEN" || { echo "::error::Configure ROMS_UPDATES_TOKEN com escrita de conteúdo no repositório público."; exit 1; }
          gh auth setup-git
          gh repo clone "$PUBLIC_REPO" "$RUNNER_TEMP/canal" -- --depth=1
          cd "$RUNNER_TEMP/canal"
          if [[ -f distribution/version.txt ]]; then
            current=$(cat distribution/version.txt)
            [[ "$current" != "$version" ]] || exit 0
            [[ "$(printf '%s\n' "$version" "$current" | sort -V | tail -1)" == "$version" ]] || exit 1
          fi
          mkdir -p distribution
          cp "$GITHUB_WORKSPACE/build/R36S_ROMS_STORE_${version}.zip" distribution/installer.zip
          printf '%s\n' "$version" > distribution/version.txt
          git config user.name github-actions
          git config user.email github-actions[bot]@users.noreply.github.com
          git add distribution
          git commit -m "Distribuir R36S ROMS STORE $version"
          git push origin HEAD:main
